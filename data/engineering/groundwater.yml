overview: >

  This project evaluates groundwater quality using heavy metal pollution
  indices, multivariate statistical techniques and spatial analysis.
  Python was used to automate statistical analysis while GIS was used
  to visualize the spatial distribution of contaminants and identify
  areas of elevated groundwater pollution.

objectives:

  - Determine the concentration of selected heavy metals in groundwater.

  - Evaluate groundwater quality using HPI, HEI and Metal Index.

  - Identify relationships among heavy metals using correlation analysis.

  - Apply Principal Component Analysis and Cluster Analysis.

  - Produce spatial distribution maps using GIS.

study_area: >

  Groundwater samples were collected from selected boreholes within the
  study area in Obuasi, Ghana. Geographic coordinates were recorded for
  each sampling location to enable spatial interpolation and mapping.

methodology:

  - Groundwater sampling

  - Laboratory analysis

  - Data validation

  - Descriptive statistics

  - Data normalization

  - Correlation analysis

  - Pollution index calculation

  - Principal Component Analysis

  - Hierarchical Cluster Analysis

  - Spatial interpolation using GIS

workflow:

  - Field reconnaissance

  - Groundwater sampling

  - Laboratory testing

  - Data cleaning

  - Statistical analysis

  - Pollution index calculation

  - Spatial analysis

  - Interpretation

  - Final report preparation

results:

  - Heavy metal concentrations were successfully quantified.

  - Pollution indices identified areas of concern.

  - Correlation analysis revealed relationships among several metals.

  - PCA identified the dominant controlling factors.

  - Cluster analysis grouped similar groundwater samples.

  - GIS maps highlighted the spatial distribution of contamination.

lessons:

  - Python greatly reduced repetitive statistical calculations.

  - GIS improved visualization of groundwater contamination.

  - Multivariate statistics provided deeper interpretation than descriptive statistics alone.

  - Combining Python and GIS creates a powerful groundwater assessment workflow.

