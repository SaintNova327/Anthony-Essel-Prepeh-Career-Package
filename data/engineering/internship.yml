overview: >

  Industrial training carried out at a mining operation to develop
  practical engineering skills in geology, mining operations,
  field mapping, sampling and technical reporting.

objectives:

  - Apply classroom knowledge in industry.

  - Learn mining operations.

  - Improve geological interpretation.

  - Develop professional communication.

study_area: >

  Industrial mining environment involving geological,
  mining and processing activities.

methodology:

  - Site reconnaissance

  - Geophysical survey planning

  - Traverse establishment

  - Electrical resistivity surveying

  - Data processing

  - Borehole drilling

  - Lithological logging

  - Borehole construction

  - Pump installation

  - Technical reporting

workflow:

  - Company orientation

  - Site reconnaissance

  - Traverse line establishment

  - Electrode installation

  - Geophysical data acquisition

  - Data interpretation

  - Borehole drilling

  - Geological logging

  - Casing installation

  - Gravel packing and grouting

  - Pump installation

  - Borehole completion

  - Final documentation

results:

  - Improved practical geological skills.

  - Better understanding of mining operations.

  - Experience working with professional engineers.

lessons:

  - Importance of safety.

  - Teamwork.

  - Professional communication.


