project:

  title: "Orebody Modelling using Leapfrog Geo"

  overview: >
    This project involved the preparation and development of a three-dimensional
    geological model using Leapfrog Geo from drillhole data. The work included
    systematic drill core logging, geological interpretation, drill core
    photography, data validation, and geological modelling. Core photographs
    were captured using a Canon EOS 5D camera mounted on a fixed horizontal
    frame to ensure consistent image quality and accurate geological
    documentation. The processed geological information was integrated into
    Leapfrog Geo to construct a representative three-dimensional geological
    model for interpretation and visualization.

  subtitle: "Geological Modelling, Core Logging and Drill Core Photography"

  category: "Engineering Experience"

  featured: true

  status: "Completed"

  hero_image: "media/engineering/leapfrog/images/hero.jpg"

  project_type: "Orebody Modelling"

  institution: "Kwame Nkrumah University of Science and Technology"

  location: "Kumasi, Ghana"

  laboratory: "KNUST Geological Engineering Laboratory"

  duration: "1 Month"

  client: "Academic Project"

  supervisor: "Dr. Blestmond Afrifa Brako"

  software:
    - Leapfrog Geo
    - Imago (Workflow Inspiration)
    - QGIS
    - Microsoft Excel
    - Python

  skills:
    - Core Logging
    - Drill Core Photography
    - Photogeology
    - Geological Interpretation
    - Orebody Modelling
    - Data Validation

  metrics:

    duration: "1 Month"

    software: "5"

