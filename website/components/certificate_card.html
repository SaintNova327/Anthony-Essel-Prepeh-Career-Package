<article class="card">

    <h3>{{ title }}</h3>

    <p>

        <strong>Provider:</strong>

        {{ provider }}

    </p>

    <p>

        <strong>Category:</strong>

        {{ category }}

    </p>

    <p>

        <strong>Year:</strong>

        {{ year }}

    </p>

    <p>

        <strong>Status:</strong>

        {{ status }}

    </p>

    <div class="project-links">

        <a
            class="button primary"
            href="{{ credential }}"
            target="_blank"
            rel="noopener noreferrer">

            Verify Certificate

        </a>

    </div>

</article>
