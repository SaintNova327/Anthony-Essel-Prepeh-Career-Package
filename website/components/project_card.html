<article class="card">

    <img
        class="project-image"
        src="{{ image }}"
        alt="{{ title }}"
        loading="lazy"
        decoding="async"
    >

    <h3>{{ title }}</h3>

    <p>

        <strong>Category:</strong>

        {{ category }}

    </p>

    <p>

        <strong>Status:</strong>

        <span class="project-status">

            {{ status }}

        </span>

    </p>

    <p>

        {{ description }}

    </p>

    <h4>Project Objective</h4>

    <p>

        {{ objective }}

    </p>

    <h4>Technologies</h4>

    <div class="project-tags">

        {{ technologies }}

    </div>

    <h4>Skills Demonstrated</h4>

    <div class="project-tags">

        {{ skills }}

    </div>

    <div class="project-links">

        <a
            class="button primary"
            href="{{ github }}"
            target="_blank"
            rel="noopener noreferrer">

            View on GitHub

        </a>

        <a
            class="button secondary"
            href="{{ demo }}"
            target="_blank"
            rel="noopener noreferrer">

            Project Details

        </a>

    </div>

</article>
