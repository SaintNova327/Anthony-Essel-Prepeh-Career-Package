<article class="card">

    <h3>{{ title }}</h3>

    <span class="project-status">
    
        {{ status }}
    
    </span>

    <p>{{ description }}</p>

    <div class="project-tags">

        {{ technologies }}

    </div>

    <div class="project-links">

        <a
            class="button primary"
            href="{{ github }}"
            target="_blank"
            rel="noopener noreferrer">

            View on GitHub

        </a>

        <a
            class="button secondary"
            href="{{ demo }}"
            target="_blank">

            Project Details

        </a>

    </div>

</article>
