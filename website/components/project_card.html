<article class="card">

    <h3>{{ title }}</h3>

    <p>{{ description }}</p>

    <div class="project-tags">

        {{ technologies }}

    </div>

    <div class="project-links">

        <a
            class="button primary"
            href="{{ github }}"
            target="_blank">

            GitHub

        </a>

        <a
            class="button secondary"
            href="{{ demo }}"
            target="_blank">

            View Project

        </a>

    </div>

</article>
