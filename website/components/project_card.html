<article class="project-card">

    <div class="project-content">

        <h3>{{ title }}</h3>

        <p>{{ description }}</p>

        <div class="project-tags">

            {{ tags }}

        </div>

        <div class="project-links">

            <a class="button primary" href="{{ github }}">

                GitHub

            </a>

            <a class="button secondary" href="{{ demo }}">

                Details

            </a>

        </div>

    </div>

</article>
