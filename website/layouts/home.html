<section class="hero">

    <div class="hero-content">

        <div class="hero-text">

            <h1>{{ name }}</h1>

            <h2>{{ profession }}</h2>

            <p>{{ tagline }}</p>

            <div class="hero-buttons">

                <a class="button primary"
                   href="assets/downloads/resume.pdf">

                    Download Resume

                </a>

                <a class="button secondary"
                   href="projects.html">

                    View Projects

                </a>

            </div>

        </div>

        <div class="hero-image">

            <img
                src="assets/images/profile.jpg"
                alt="{{ name }}"
            >

        </div>

    </div>

</section>

<section>

    <h2>Professional Summary</h2>

    {{ career_summary }}

</section>

<section>

    <h2>Core Skills</h2>

    {{ skills }}

</section>

<section>

    <h2>Featured Projects</h2>

    {{ projects }}

</section>
