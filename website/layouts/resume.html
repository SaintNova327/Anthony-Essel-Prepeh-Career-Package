<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ name }} | Resume</title>

    <link
        rel="stylesheet"
        href="css/resume.css"
    >

</head>

<body>

    <div class="resume">

        <header class="resume-header">

            <h1>{{ name }}</h1>

            <h2>{{ profession }}</h2>

            <hr>

        </header>

        <main class="resume-content">

            {{ resume }}

        </main>

    </div>

</body>

</html>
